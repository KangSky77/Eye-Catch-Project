name: tests

# 회귀 테스트는 GPU·Ollama·PostgreSQL·카카오 API를 모킹해 외부 서비스 없이 실행된다.
# 사람 기억("커밋 전에 돌려보세요")에 맡기지 않고 PR마다 자동으로 돌린다.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Frontend request lifecycle regression tests
        run: npm test

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = README가 광고하는 최소 버전(실제로 지켜지는지 확인), 3.13 = 최신 안정.
        # 로컬 개발은 3.14지만 러너 wheel 사정이 달라 CI는 이 둘로 고정한다.
        # 3.11 + CPU torch + 아래 고정 버전 조합도 PR마다 이 작업으로 검증한다.
        python-version: ["3.11", "3.13"]
    name: pytest (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-base.txt

      - name: torch (CPU 빌드) 설치
        # requirements.txt는 CUDA 빌드(+cu130, 수 GB)를 고정하므로 CI에서는 쓰지 않는다.
        # 테스트는 추론을 전부 모킹하고 torch의 API 표면(nn/models/transforms/softmax/flip)만
        # 쓰기 때문에 CPU 최신 빌드로 충분하다.
        # 트레이드오프: 고정된 2.12.0+cu130 자체의 API 변화는 CI가 잡지 못한다.
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: 나머지 의존성 설치 (버전 고정)
        run: pip install -r requirements-base.txt

      - name: 얼굴 검출기(facenet-pytorch) 설치
        # tests/test_edge_face_api.py는 실제 MTCNN으로 '가려진 얼굴이 모델에 닿지 않는다'를
        # 검사한다. 2026-09-13부터 검출기가 없으면 사진 분석이 503으로 중단되므로(의도),
        # 검출기를 빼고 돌리면 그 테스트가 전부 실패한다 — CI가 이 경로를 실제로 검사하도록 설치한다.
        # --no-deps: torch/torchvision은 위에서 CPU 빌드로 이미 고정했다.
        run: pip install --no-deps facenet-pytorch

      - name: pytest
        # .pth(가중치)는 저장소에 없으므로 관련 2건은 자동 skip된다 — 정상 동작.
        run: pytest -q -rs
