[pytest]
testpaths = tests
pythonpath = .
# torch/torchvision/facenet 내부 소음만 무시 (모듈 패턴은 접두사 매칭이라
# torch가 torchvision도 커버). 앱 자체 코드의 경고(pydantic/FastAPI deprecation,
# PIL 압축폭탄 경고 등)는 업그레이드 조기 신호이므로 삼키지 않는다.
filterwarnings =
    ignore::DeprecationWarning:torch
    ignore::UserWarning:torch
    ignore::DeprecationWarning:facenet_pytorch
    ignore::UserWarning:facenet_pytorch
