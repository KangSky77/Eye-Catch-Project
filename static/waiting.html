<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8faff"><title>Eye-Catch | Waiting room</title>
<link rel="icon" href="/static/favicon.svg"><link rel="stylesheet" href="/static/queue.css?v=20261008design3">
</head>
<body class="waiting-entry" data-waiting-entry>
<header class="queue-header">
<a class="queue-brand" href="/" aria-label="Eye-Catch">
<span class="queue-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M2.75 12s3.45-5.25 9.25-5.25S21.25 12 21.25 12 17.8 17.25 12 17.25 2.75 12 2.75 12Z"/><circle cx="12" cy="12" r="2.75"/></svg></span>
<span>Eye-Catch</span></a>
<select id="queue-language" aria-label="Language">
<option value="ko">한국어</option><option value="en">English</option><option value="es">Español</option>
<option value="fr">Français</option><option value="ja">日本語</option><option value="zh">中文</option>
</select>
</header>
<main class="queue-shell">
<section class="queue-card" id="queue-card" aria-labelledby="queue-title">
<div class="queue-status"><span class="queue-status-dot" aria-hidden="true"></span><span id="queue-badge">자동 입장 대기</span></div>
<div class="queue-visual" aria-hidden="true"><svg viewBox="0 0 96 96" fill="none"><rect x="18" y="20" width="57" height="56" rx="12" fill="#DBEAFE" transform="rotate(-12 46 48)"/><rect x="20" y="18" width="57" height="56" rx="12" fill="white" stroke="#BDD3FF" stroke-width="1.5"/><path d="M30 44s7-10 18-10 18 10 18 10-7 10-18 10-18-10-18-10Z" stroke="#2563EB" stroke-width="2.5"/><circle cx="48" cy="44" r="5" stroke="#2563EB" stroke-width="2.5"/><path d="M37 64h22" stroke="#D3E2FF" stroke-width="3" stroke-linecap="round"/><circle cx="73" cy="73" r="15" fill="#2563EB" stroke="white" stroke-width="4"/><path d="M73 65v8l5 3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<h1 id="queue-title">입장 준비 중</h1>
<p id="queue-description">잠시만 기다려 주세요.</p>
<div id="queue-position" class="queue-ticket" role="status" aria-live="polite" aria-atomic="true" hidden></div>
<div class="queue-help"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6.7M20 5v6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><p id="queue-note"></p></div>
<button id="queue-cancel" type="button">대기 취소</button>
<p id="queue-care" class="queue-care"></p>
<noscript>자바스크립트를 켜주세요. / Please enable JavaScript.</noscript>
</section></main><script src="/static/app-admission.js?v=20261008design2"></script>
</body></html>
